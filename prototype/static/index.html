<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select your vehicle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    select, input { display: block; width: 100%; box-sizing: border-box; padding: .5rem; margin-top: .25rem; font: inherit; }
    button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    .message { margin-top: 1rem; padding: .75rem; border-radius: .25rem; }
    .error { background: #fde8e8; color: #8a1c1c; }
    .success { background: #e3f6e8; color: #17602c; }
    .info { background: #fff4d6; color: #6b4e00; }
    #retry { margin-top: .5rem; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Select your vehicle</h1>
  <p>Signed in as the demo user.</p>

  <div id="error" class="message error" role="alert" hidden>
    <div id="error-text"></div>
    <button id="retry" type="button">Retry</button>
  </div>

  <label for="make-filter">Filter makes</label>
  <input id="make-filter" type="search" autocomplete="off">
  <label for="make">Make</label>
  <select id="make" disabled></select>

  <label for="model-filter">Filter models</label>
  <input id="model-filter" type="search" autocomplete="off" disabled>
  <label for="model">Model</label>
  <select id="model" disabled></select>

  <label for="year">Year</label>
  <select id="year" disabled></select>

  <label for="trim">Trim</label>
  <select id="trim" disabled></select>

  <button id="save" type="button" disabled>Save vehicle</button>
  <div id="status" class="message" role="status" hidden></div>

  <h2>Your saved vehicles</h2>
  <ul id="saved"></ul>
  <p id="saved-empty" hidden>No saved vehicles yet.</p>

  <script src="/static/vehicle-select.js"></script>
</body>
</html>
